<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --text:#111113; --muted:#6B6B73; --line:#EBEBEE; --line2:#D9D9DE; --fill:#F4F4F6;
  --accent:#111113; --accent-fg:#FFFFFF; --accent-soft:#F1F1F3; --accent-text:#111113;
  --rosa:#5B3FE0; --rosa-soft:#EEEAFF;
  --grad:#111113; --hero-ink:#111113; --glow:rgba(17,17,19,.25);
  --hero:#111113; --hero-glow:rgba(17,17,19,.4); --hero-borde:transparent;
  --ok:#1C7F54; --ok-soft:#E6F4EC; --danger:#C22E3B; --bar-mid:#D99A2B;
  --amber:#9A5A00; --amber-soft:#F4F4F6; --blue:#2A58B8; --blue-soft:#F4F4F6; --violet:#643AB5; --violet-soft:#F4F4F6; --teal:#0F6F68; --teal-soft:#F4F4F6;
  --shadow:0 1px 2px rgba(17,17,19,.04),0 10px 22px -16px rgba(17,17,19,.16);
  --overlay:rgba(17,17,19,.4);
  --ui:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0C; --surface:#151517; --text:#F5F5F7; --muted:#A1A1AA; --line:#26262A; --line2:#36363C; --fill:#1F1F23;
    --accent:#F5F5F7; --accent-fg:#111113; --accent-soft:#232327; --accent-text:#F5F5F7;
    --rosa:#A08BFF; --rosa-soft:#241E3D;
    --grad:#F5F5F7; --glow:rgba(0,0,0,.6);
    --hero:#1B1B1E; --hero-glow:rgba(0,0,0,.6); --hero-borde:#2E2E33;
    --ok:#5FCB97; --ok-soft:#14301F; --danger:#FF8A92; --bar-mid:#E0A840;
    --amber-soft:#1F1F23; --blue-soft:#1F1F23; --violet-soft:#1F1F23; --teal-soft:#1F1F23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 22px -16px rgba(0,0,0,.7);
    --overlay:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0C; --surface:#151517; --text:#F5F5F7; --muted:#A1A1AA; --line:#26262A; --line2:#36363C; --fill:#1F1F23;
  --accent:#F5F5F7; --accent-fg:#111113; --accent-soft:#232327; --accent-text:#F5F5F7;
  --rosa:#A08BFF; --rosa-soft:#241E3D;
  --grad:#F5F5F7; --glow:rgba(0,0,0,.6);
  --hero:#1B1B1E; --hero-glow:rgba(0,0,0,.6); --hero-borde:#2E2E33;
  --ok:#5FCB97; --ok-soft:#14301F; --danger:#FF8A92; --bar-mid:#E0A840;
  --amber-soft:#1F1F23; --blue-soft:#1F1F23; --violet-soft:#1F1F23; --teal-soft:#1F1F23;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 22px -16px rgba(0,0,0,.7);
  --overlay:rgba(0,0,0,.62);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
svg{display:block;flex:none}

#app{max-width:480px;margin:0 auto;padding:0 18px calc(100px + env(safe-area-inset-bottom,0px))}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
.marca{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:800;letter-spacing:-.03em}
.marca::before{content:"";width:22px;height:22px;border-radius:7px;background:var(--grad)}
.icono{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.cab{padding:8px 0 2px}
.fecha-hoy{font-size:.9rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.titulo{font-size:2rem;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.perfil{display:flex;align-items:center;gap:14px}
.perfil .titulo{font-size:1.7rem}
.avatar{width:56px;height:56px;flex:none;border-radius:18px;background:var(--grad);color:#FFFFFF;display:grid;place-items:center;font-size:1.5rem;font-weight:800;box-shadow:0 12px 20px -12px var(--glow)}
.enlace{color:var(--accent-text);font-weight:700;min-height:44px;text-align:left}
.apoyo{color:var(--muted);font-size:.94rem;margin:0 0 14px}
main{padding-top:16px}

/* gesto del día */
.gesto{position:relative;overflow:hidden;background:var(--grad);color:#FFFFFF;border-radius:22px;padding:18px;box-shadow:0 16px 30px -18px var(--glow)}
.gesto::before{content:"";position:absolute;right:-60px;top:-76px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.1)}
.gesto::after{content:"";position:absolute;right:36px;bottom:-104px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07)}
.gesto > *{position:relative;z-index:1}
.gesto-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.gesto-t,.hecho-chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;border-radius:999px;padding:5px 11px 5px 8px}
.gesto-t{background:rgba(255,255,255,.18)}
.hecho-chip{background:#FFFFFF;color:var(--hero-ink)}
.gesto-x{font-size:1.32rem;font-weight:700;line-height:1.28;letter-spacing:-.02em;text-wrap:balance}
.gesto-cita{font-style:italic;font-weight:500;color:rgba(255,255,255,.92);margin-top:8px}
.gesto-n{font-size:.88rem;font-weight:500;color:rgba(255,255,255,.9);margin-top:8px}
.gesto-b{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.gesto .b-pri{background:#FFFFFF;color:var(--hero-ink);box-shadow:none}
.gesto .b-sec{background:rgba(255,255,255,.17);color:#FFFFFF}
.gesto :focus-visible{outline-color:#FFFFFF}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{display:flex;flex-direction:column;gap:3px;min-height:74px;padding:12px 12px 11px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat b{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;font-weight:600;color:var(--muted);line-height:1.25}
button.stat b{color:var(--accent-text)}

/* botones */
.b{min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:.96rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .12s ease}
.b:active{transform:scale(.97)}
.b-pri{background:var(--accent);color:var(--accent-fg);box-shadow:0 10px 18px -12px var(--accent)}
.b-sec{background:var(--fill);color:var(--text)}
.b-peligro{background:var(--fill);color:var(--danger)}
.b-ancho{width:100%}
.captura{width:100%;margin-top:12px;min-height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:0 14px;font-weight:700;font-size:.96rem;text-align:left}
.captura svg{width:32px;height:32px;padding:6px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text)}
main > .captura:first-child{margin-top:0}

/* secciones y listas */
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.sub{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.sec .enlace{margin-left:auto;font-size:.88rem;min-height:32px}
.cuenta{font-size:.76rem;font-weight:700;color:var(--muted);background:var(--fill);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.ico{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center}
.ico svg{width:17px;height:17px}
.ico-gustos{background:var(--accent-soft);color:var(--accent-text)}
.ico-comida{background:var(--amber-soft);color:var(--amber)}
.ico-tallas{background:var(--blue-soft);color:var(--blue)}
.ico-nogusta{background:var(--violet-soft);color:var(--violet)}
.ico-dijo{background:var(--ok-soft);color:var(--ok)}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.fila{display:flex;align-items:center;gap:12px;padding:13px 10px 13px 14px;border-top:1px solid var(--line)}
.fila:first-child{border-top:0}
.fila-f{align-items:flex-start}
.fila-c{flex:1;min-width:0}
.nota-x{font-size:.98rem;font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.meta{font-size:.84rem;color:var(--muted);margin-top:2px}
.mini{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.mini:hover{background:var(--fill)}
.mini[aria-pressed="true"]{color:var(--accent-text);background:var(--accent-soft)}
.acc{display:flex;gap:2px}
.vacio{background:var(--surface);border:1px dashed var(--line2);border-radius:18px;padding:22px 18px;text-align:center;color:var(--muted);margin-top:14px}
.vacio p{margin:0 auto 14px;max-width:32ch}
.vacio p:last-child{margin-bottom:0}

/* segmentos y filtros */
.seg{display:flex;background:var(--fill);border-radius:13px;padding:3px;margin-bottom:14px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(22,20,29,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 14px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.88rem;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chips.env{flex-wrap:wrap;overflow:visible;margin:0;padding:0}

/* fechas */
.dia{width:48px;height:52px;flex:none;border-radius:13px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dia b{font-size:1.14rem;font-weight:800;letter-spacing:-.02em}
.dia span{font-size:.7rem;font-weight:600;color:var(--muted);margin-top:3px}
.toca .dia{background:var(--grad);color:#FFFFFF}
.toca .dia span{color:rgba(255,255,255,.92)}
.fecha-t{font-weight:700;font-size:.98rem;letter-spacing:-.01em;overflow-wrap:anywhere}
.cuando{flex:none;margin-top:2px;font-size:.76rem;font-weight:700;border-radius:999px;padding:4px 9px;background:var(--fill);color:var(--muted);white-space:nowrap}
.toca .cuando{background:var(--accent-soft);color:var(--accent-text)}
.aviso{font-size:.84rem;font-weight:700;color:var(--accent-text);margin-top:6px}
.fila .enlace{display:block;font-size:.88rem;min-height:30px;margin-top:2px;text-decoration:underline;text-underline-offset:3px}
.fila-f .mini{margin:-2px -2px 0 -6px}

/* manual */
.sit{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.sit-b{width:100%;min-height:58px;padding:0 12px 0 16px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;font-size:.98rem}
.sit-n{flex:1;min-width:0}
.sit-b svg{color:var(--muted);transition:transform .18s ease}
.sit-b[aria-expanded="true"] svg{transform:rotate(180deg)}
.sit-c{padding:0 16px 16px}
.bloque{padding-top:14px;margin-top:12px;border-top:1px solid var(--line)}
.bloque:first-child{margin-top:0}
.bloque h3{font-size:.86rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.punto{width:8px;height:8px;border-radius:50%;flex:none}
.p-ayuda{background:var(--ok)} .p-evitar{background:var(--danger)} .p-frases{background:var(--accent)}
.item{display:flex;align-items:center;gap:8px}
.item .nota-x{flex:1;padding:6px 0}
.item .mini{margin-right:-6px}
.agregar{display:flex;gap:8px;margin-top:8px}
.campo{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);padding:10px 13px;font-weight:500}
.campo:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hoja .campo,.sit .campo{background:var(--bg)}
.agregar .campo{flex:1;min-width:0}
.agregar .b{padding:0 15px}
textarea.campo{min-height:104px;resize:vertical;line-height:1.4}
.campo::placeholder{color:var(--muted);opacity:.8}
.enlace.quitar{margin-top:10px;font-size:.88rem;color:var(--danger)}

/* regalos */
.marca-dado{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;flex:none}
.marca-dado[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dado .nota-x{text-decoration:line-through;color:var(--muted)}

/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tabs{background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
}
.tabs-in{max-width:480px;margin:0 auto;display:flex;padding:8px 10px 6px}
.tab{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted)}
.tab-i{width:54px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .15s ease}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab[aria-current="page"] .tab-i{background:var(--accent-soft)}

/* hoja inferior */
.velo{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:aparece .16s ease}
.hoja{background:var(--surface);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sube .22s ease}
.hoja::before{content:"";display:block;width:40px;height:4px;border-radius:999px;background:var(--line2);margin:0 auto 18px}
.hoja h2{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;margin-bottom:16px}
.hoja label,.hoja .rot{display:block;font-weight:700;font-size:.86rem;margin:16px 0 7px}
.hoja h2 + label{margin-top:0}
.hoja .opcion{display:flex;align-items:center;gap:10px;min-height:44px;margin:10px 0 0;font-weight:600;font-size:.96rem}
.opcion input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.hoja-b{display:flex;gap:8px;margin-top:22px}
.hoja-b .b{flex:1;padding:0 10px}
.error{color:var(--danger);font-size:.86rem;font-weight:600;margin-top:6px;min-height:1.2em}
.linea{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.estado{font-size:.88rem;color:var(--muted)}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes sube{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}

/* bienvenida */
.bien{padding:9vh 2px 30px}
.logo{width:64px;height:64px;border-radius:20px;background:var(--grad);color:#FFFFFF;display:grid;place-items:center;box-shadow:0 16px 26px -14px var(--glow)}
.logo svg{width:32px;height:32px}
.marca-g{font-size:2.6rem;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:18px}
.bien-x{font-size:1.3rem;font-weight:700;line-height:1.28;letter-spacing:-.02em;margin:10px 0 22px;max-width:22ch;color:var(--muted)}
.puntos{display:grid;gap:14px;margin-bottom:28px}
.puntos li{display:flex;gap:12px;align-items:flex-start}
.puntos .ico{width:36px;height:36px;border-radius:12px}
.puntos .ico svg{width:20px;height:20px}
.puntos b{display:block;font-weight:700;font-size:.98rem}
.puntos p{font-size:.88rem;color:var(--muted)}
.bien .b{margin-bottom:8px}
.cargando{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-weight:600}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:30;max-width:calc(100% - 36px);text-align:center;box-shadow:var(--shadow)}
#toast.ver{opacity:1;transform:translate(-50%,0)}
.pie{font-size:.82rem;color:var(--muted);margin-top:18px}

/* ---- gesto: tarjeta principal más sobria ---- */
.gesto{background:var(--hero);box-shadow:0 18px 30px -18px var(--hero-glow)}
.gesto .b-pri,.hecho-chip{color:#3A1746}
.porque{font-size:.76rem;font-weight:600;color:rgba(255,255,255,.86);text-align:right;line-height:1.25}
.racha{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);font-size:.78rem;font-weight:600;color:rgba(255,255,255,.86)}
.dots{display:flex;gap:6px;margin-left:auto}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;width:18px;font-size:.62rem;font-weight:700;color:rgba(255,255,255,.72)}
.dot i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.42)}
.dot.on i{background:#A08BFF;border-color:#A08BFF}
.dot.hoy{color:#FFFFFF}
.dot.hoy i{box-shadow:0 0 0 2.5px rgba(255,255,255,.3)}
.racha b{font-size:.86rem;color:#FFFFFF;font-variant-numeric:tabular-nums}

/* ---- tarjetas ---- */
.tarjeta{display:block;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.juntas-c{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;text-align:left}
.anillo-w{position:relative;width:56px;height:56px;flex:none;display:grid;place-items:center;color:var(--accent-text);border-radius:50%;background:var(--accent-soft)}
.anillo{position:absolute;inset:0;width:100%;height:100%}
.anillo circle{fill:none;stroke-width:5}
.anillo-f{stroke:var(--fill)}
.anillo-p{stroke:var(--accent);stroke-linecap:round}
.tarjeta .anillo-w:has(.anillo){background:none}
.juntas-t{font-size:1.06rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}

.b-chico{min-height:36px;padding:0 12px;border-radius:10px;font-size:.84rem;box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-size:.82rem;font-weight:700;white-space:nowrap}
.pill-ok{background:var(--ok-soft);color:var(--ok)}

/* ---- María ---- */
.amor{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.amor-l{font-size:.84rem;font-weight:600;color:var(--muted)}
.amor .enlace{min-height:30px;font-size:.84rem}
.preg{margin-bottom:16px}
.preg-l{font-size:.78rem;font-weight:700;color:var(--violet)}
.preg-x{font-size:1.04rem;font-weight:700;line-height:1.35;letter-spacing:-.01em;margin:6px 0 12px}
.ico-suenos{background:var(--teal-soft);color:var(--teal)}
.opc{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line2);margin-top:8px}

/* ---- Crecer ---- */
.rev h2{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}

.rev-pie{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

.rit .mini{margin-left:-6px}

.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sug .chip{white-space:normal;text-align:left;min-height:34px;font-size:.84rem}
.apr .meta b{font-weight:700;color:var(--text)}
.sec .cuenta + .enlace,.sec .sub + .enlace{margin-left:auto}
.tab-i{width:48px}

/* ---- paleta blanca: negro como acento, color solo para avisar ---- */
.avatar,.logo{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.enlace{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.gesto{border:1px solid var(--hero-borde)}
.gesto::before,.gesto::after{background:rgba(255,255,255,.06)}
.gesto .b-pri,.hecho-chip{color:#111113}
.dot.on i{background:#FFFFFF;border-color:#FFFFFF}
.b-pri{box-shadow:0 10px 18px -14px rgba(0,0,0,.55)}
.ico-gustos,.ico-comida,.ico-tallas,.ico-nogusta,.ico-dijo,.ico-suenos{background:var(--fill);color:var(--text)}
.preg-l{color:var(--muted)}
.mini[aria-pressed="true"]{color:var(--rosa);background:var(--rosa-soft)}
.anillo-w{color:var(--rosa);background:var(--rosa-soft)}
.anillo-p{stroke:var(--rosa)}
.toca .dia{background:var(--accent);color:var(--accent-fg)}
.toca .dia span{color:var(--accent-fg);opacity:.8}
.toca .cuando{background:var(--rosa-soft);color:var(--rosa)}
.aviso,.venc .meta{color:var(--rosa)}
.venc .barra i{background:var(--rosa)}
.p-frases{background:var(--bar-mid)}
.captura svg{background:var(--fill);color:var(--text)}
.pill{background:var(--fill);color:var(--text)}
.opc[aria-pressed="true"]{background:var(--fill)}
button.stat b{color:var(--text)}
.tab[aria-current="page"] .tab-i{background:var(--fill)}
.enlace.quitar{color:var(--danger)}

/* ---- componentes nuevos ---- */
.stats{margin:0 0 14px}
.valoro-c{margin-top:12px}
.valoro-c .agregar{margin-top:8px}
.valoro-c .enlace{display:block;font-size:.86rem;min-height:30px;margin-top:8px}
.seg button{font-size:.86rem}
.guia{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px}
.guia .ico{width:42px;height:42px;border-radius:13px;background:var(--fill);color:var(--text)}
.guia .ico svg{width:22px;height:22px}
.guia b{display:block;font-size:1rem;font-weight:700}
.guia .d{display:block;font-size:.86rem;color:var(--muted);margin-top:1px}
.guia > svg{margin-left:auto;color:var(--muted);transform:rotate(-90deg)}
.pasos{margin:0 0 4px;padding:0;list-style:none;counter-reset:paso}
.pasos li{position:relative;padding:2px 0 14px 42px;font-size:.94rem;color:var(--muted);counter-increment:paso}
.pasos li::before{content:counter(paso);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:.84rem}
.pasos b{display:block;color:var(--text);font-weight:700}
.lista-s{display:grid;gap:7px}
.lista-s p{display:flex;gap:9px;align-items:baseline;font-size:.94rem}
.lista-s .punto{transform:translateY(-1px)}
.elegida{border:1.5px solid var(--text)}
#res{min-height:150px}
.tab{font-size:.68rem}
.tab-i{width:44px}
.cheq{margin-top:12px}
.seg + .cheq{margin-top:0}
.cheq h2{font-size:1.08rem;font-weight:800;letter-spacing:-.02em}
.cheq-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.cheq .nota-mi{margin:0 0 8px}
.cheq > .meta{margin:0}
.cheq-b{display:flex;align-items:center;gap:8px;margin-top:12px}
.campo-chica{flex:1;min-width:0;min-height:36px;padding:4px 10px;border-radius:10px;font-size:.84rem;font-weight:600}
.pill-rosa{background:var(--rosa-soft);color:var(--rosa)}
.vf{display:grid;gap:5px;padding:10px 0}
.vf + .vf{border-top:1px solid var(--line)}
.vf label{font-size:.8rem;font-weight:700;color:var(--muted)}
.vf .campo{min-height:44px}
.vida-cum{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.vida-cum .ico{width:42px;height:42px;border-radius:13px;background:var(--rosa-soft);color:var(--rosa)}
.vida-cum .ico svg{width:22px;height:22px}
.vida-cum .meta{margin-top:1px}
.tema-t{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tema-t:empty{display:none}
.pill-s{min-height:24px;padding:0 9px;font-size:.74rem}
.tema-b{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dado .meta .neg{font-weight:700;color:var(--text)}
.cheq-temas{display:block;min-height:30px;font-size:.86rem;margin-top:6px}
.seg button{padding:0 4px}
.gen .rot{display:block;font-weight:700;font-size:.84rem;margin:14px 0 8px}
.gen .rot:first-child{margin-top:0}
.gen-r{margin-top:12px;border:1.5px solid var(--text)}
.gen-plan{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:6px 0 12px}
.gen-l{padding:10px 0;border-top:1px solid var(--line)}
.gen-l span{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.gen-l p{font-size:.96rem;font-weight:500}
.atrasado{color:var(--rosa)!important;font-weight:600}
.mini-mas{background:var(--fill);color:var(--text)}
.guia{padding-top:16px;padding-bottom:16px}
.buscar{margin:12px 0}
.vida-l{margin-top:12px}
.buscar + .vida-l{margin-top:0}
.vida-l .fila[hidden],.vida-l[hidden]{display:none}
.hero{display:flex;align-items:center;gap:16px}
.hero-t{min-width:0}
.hero-t .titulo{font-size:1.9rem;margin-bottom:2px}
.hero-t .meta{margin-top:1px}
.avatar-b{position:relative;width:92px;height:92px;flex:none;border-radius:50%;background:var(--fill);display:grid;place-items:center;transition:transform .15s ease}
.avatar-b:active{transform:scale(.96)}
.avatar-b.con-foto{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--rosa)}
.avatar-b img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-i{font-size:2.1rem;font-weight:800;color:var(--muted)}
.avatar-b .cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;border:3px solid var(--bg)}
.avatar-b .cam svg{width:16px;height:16px}
.fotos{display:flex;gap:8px;overflow-x:auto;margin:18px -18px 0;padding:0 18px 2px;scroll-snap-type:x proximity;scroll-padding-inline:18px;scrollbar-width:none}
.fotos::-webkit-scrollbar{display:none}
.foto-t{flex:none;width:92px;height:118px;border-radius:16px;overflow:hidden;background:var(--fill);scroll-snap-align:start;transition:transform .15s ease}
.foto-t:active{transform:scale(.96)}
.foto-t img{width:100%;height:100%;object-fit:cover;display:block}
.foto-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line2);background:transparent;color:var(--muted);font-size:.8rem;font-weight:700}
.amor{margin-top:16px}
.foto-g img,.avatar-g img{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:16px;background:var(--fill)}
.avatar-g img{width:200px;height:200px;object-fit:cover;border-radius:50%;margin:0 auto}
.hoja label#ht{margin-top:16px}
.anillo-img{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);object-fit:cover;border-radius:50%}
.rec{position:relative;margin-top:12px;border-radius:20px;overflow:hidden;background:var(--fill);box-shadow:var(--shadow)}
.rec-img{display:block;width:100%}
.rec-img img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.rec-pie{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#FFFFFF;pointer-events:none}
.rec-l{font-size:.76rem;font-weight:700;opacity:.9}
.rec-pie p{font-size:1rem;font-weight:700;line-height:1.3;margin-top:2px}
.rec-otro{position:absolute;top:12px;right:12px;min-height:34px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.42);color:#FFFFFF;font-size:.82rem;font-weight:700}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .rec-otro{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)} }
.nota-mi{font-size:.86rem;line-height:1.4;color:var(--muted);border-left:2px solid var(--line2);padding-left:10px;margin:0 0 12px}
.sec + .nota-mi{margin-top:-2px}

/* ================= Nov 2: color, movimiento y formas nuevas ================= */
:root{
  --accent:#5B3FE0; --accent-fg:#FFFFFF; --accent-soft:#EEEAFF; --accent-text:#4A2FCC;
  --grad:linear-gradient(135deg,#2F9BFF,#7B5CFF);
  --k-palabras:#6A4CFF; --k-tiempo:#1F7AE0; --k-detalles:#E07A00; --k-actos:#0E9F7A; --k-contacto:#F2602E;
  --fondo-a:rgba(47,155,255,.10); --fondo-b:rgba(123,92,255,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#A08BFF; --accent-fg:#150B33; --accent-soft:#241E3D; --accent-text:#BFAFFF;
    --k-palabras:#A08BFF; --k-tiempo:#6CB4FF; --k-detalles:#FFA94D; --k-actos:#4FD6AE; --k-contacto:#FF9D6B;
    --fondo-a:rgba(47,155,255,.13); --fondo-b:rgba(123,92,255,.14); --grad:linear-gradient(135deg,#2F9BFF,#7B5CFF);
  }
}
:root[data-theme="dark"]{
  --accent:#A08BFF; --accent-fg:#150B33; --accent-soft:#241E3D; --accent-text:#BFAFFF;
  --k-palabras:#A08BFF; --k-tiempo:#6CB4FF; --k-detalles:#FFA94D; --k-actos:#4FD6AE; --k-contacto:#FF9D6B;
  --fondo-a:rgba(47,155,255,.13); --fondo-b:rgba(123,92,255,.14); --grad:linear-gradient(135deg,#2F9BFF,#7B5CFF);
}
body{background:radial-gradient(900px 420px at 110% -10%,var(--fondo-a),transparent 60%),radial-gradient(700px 380px at -20% 0%,var(--fondo-b),transparent 60%) no-repeat,var(--bg)}
.g-rosa{--g1:#E07A00;--g2:#C2410C}
.g-lila{--g1:#6A4CFF;--g2:#A23BE8}
.g-cielo{--g1:#1F7AE0;--g2:#4B4FE0}
.g-menta{--g1:#0E9F7A;--g2:#0B7896}
.g-coral{--g1:#F2602E;--g2:#D9480F}
.g-amar{--g1:#E8A300;--g2:#F2602E}
.marca::before{background:var(--grad)}
.avatar,.logo{background:var(--grad);color:#FFFFFF}
.b-pri{background:var(--accent);color:var(--accent-fg);box-shadow:0 10px 20px -12px var(--accent)}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab[aria-current="page"] .tab-i{background:var(--accent-soft);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.pasos li::before{background:var(--grad);color:#FFFFFF}
.titulo{background:linear-gradient(90deg,var(--text) 55%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-t .titulo,.perfil .titulo{-webkit-text-fill-color:currentColor;background:none}

/* entrada de pantalla */
main.anim > *{animation:entra .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes fluye{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes brilla{0%{transform:translateX(-120%) rotate(20deg)}100%{transform:translateX(220%) rotate(20deg)}}

/* carta del gesto */
.flip{perspective:1400px}
.flip-in{display:grid;transition:transform .8s cubic-bezier(.3,1.3,.4,1);transform-style:preserve-3d}
.flip.volteada .flip-in{transform:rotateY(180deg)}
.cara{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:24px;min-height:248px}
.atras{transform:rotateY(180deg)}
.frente{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;color:#FFFFFF;text-align:center;
  background:radial-gradient(circle at 20% 25%,rgba(255,255,255,.18) 0 2px,transparent 3px) 0 0/34px 34px,linear-gradient(135deg,#2A1650,#4B3CC9 55%,#2F9BFF);box-shadow:0 18px 34px -18px rgba(75,60,201,.8)}
.frente::after{content:"";position:absolute;top:-30%;left:0;width:40%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:brilla 3.2s ease-in-out infinite}
.frente-i{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;margin-bottom:6px;animation:late 1.8s ease-in-out infinite}
.frente-i svg{width:30px;height:30px}
.frente b{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.frente span:last-child{font-size:.88rem;opacity:.85;font-weight:600}
.gesto{background:linear-gradient(135deg,var(--g1),var(--g2),var(--g1));background-size:220% 220%;animation:fluye 9s ease infinite;border:0;box-shadow:0 18px 30px -18px var(--g1)}
.gesto .b-pri,.hecho-chip{color:var(--g1)}
.gesto-x.nuevo{animation:entra .45s cubic-bezier(.2,.8,.2,1)}

/* racha */
.racha-c{display:flex;align-items:center;gap:16px;margin-top:12px}
.racha-n{display:flex;flex-direction:column;align-items:center;min-width:76px}
.flama{width:44px;height:44px;color:var(--line2)}
.flama.viva{color:#F2602E;animation:late 1.4s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(242,96,46,.45))}
.flama svg{width:100%;height:100%}
.racha-n b{font-size:1.7rem;font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:2px}
.racha-n span{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.hm{flex:1;min-width:0}
.hm-g{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.hm-c{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.hm-c i{display:block;aspect-ratio:1;border-radius:3px;background:var(--fill)}
.hm-c i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface))}
.hm-c i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--surface))}
.hm-c i.l3{background:var(--accent)}
.hm-c i.fut{background:transparent}
.hm-c i.hoy{outline:1.5px solid var(--text);outline-offset:1px}
.hm-p{display:flex;justify-content:space-between;font-size:.7rem;font-weight:600;color:var(--muted);margin-top:6px}

/* reto */
.reto{position:relative;overflow:hidden;margin-top:12px;border-radius:22px;padding:18px;color:#FFFFFF;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 16px 28px -18px var(--g1)}
.reto::before{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1)}
.reto > *{position:relative}
.reto-top{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;font-weight:700;opacity:.92}
.reto-t{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:8px 0 4px}
.reto-d{font-size:.92rem;opacity:.92}
.reto-p{display:flex;gap:6px;margin:14px 0 2px}
.reto-p i{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden}
.reto-p i.on{background:#FFFFFF}
.reto-p i.on:last-of-type{animation:pop .4s ease}
.reto .b-pri{background:#FFFFFF;color:var(--g1);box-shadow:none}
.reto .b-sec{background:rgba(255,255,255,.2);color:#FFFFFF}
.reto.ok .reto-t::after{content:" ✓"}
.reto .gesto-b{margin-top:14px}

/* tiempo juntas */
.juntas2{margin-top:12px}
.j-top{display:flex;align-items:center;gap:10px}
.j-foto{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.j-ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.j-ico svg{width:18px;height:18px}
.j-num{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.j-num div{border-radius:16px;padding:12px 8px 10px;text-align:center;background:color-mix(in srgb,var(--g1) 10%,var(--surface))}
.j-num b{display:block;font-size:2rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--g1);font-variant-numeric:tabular-nums}
.j-num span{font-size:.76rem;font-weight:700;color:var(--muted)}
.j-barra{position:relative;height:8px;border-radius:999px;background:var(--fill);margin:20px 4px 0}
.j-barra i{display:block;height:100%;border-radius:999px;background:var(--grad);transform-origin:left;animation:crece 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.j-cora{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow);animation:late 1.6s ease-in-out infinite}
.j-cora svg{width:15px;height:15px;fill:currentColor}
.j-pie{margin-top:10px;text-align:center;font-weight:600}

/* fechas en carrusel */
.fechas-h{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scroll-snap-type:x proximity;scroll-padding-inline:18px;scrollbar-width:none}
.fechas-h::-webkit-scrollbar{display:none}
.fh{flex:none;width:136px;min-height:150px;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;scroll-snap-align:start;
  background:color-mix(in srgb,var(--g1) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--g1) 22%,transparent);transition:transform .15s ease}
.fh:active{transform:scale(.97)}
.fh b{font-size:2.3rem;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--g1)}
.fh-m{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--g1)}
.fh-t{font-size:.92rem;font-weight:700;line-height:1.25;margin-top:auto;padding-top:10px}
.fh-c{font-size:.76rem;font-weight:700;color:var(--muted);margin-top:2px}
.fh.toca{background:linear-gradient(135deg,var(--g1),var(--g2));border:0;color:#FFFFFF}
.fh.toca b,.fh.toca .fh-m,.fh.toca .fh-c{color:#FFFFFF}

/* fechas en línea de tiempo */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(var(--accent),#7B5CFF,var(--line))}
.tl-mes{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.tl-mes:first-child{margin-top:4px}
.tl-i{position:relative;margin-bottom:10px}
.tl-i::before{content:"";position:absolute;left:-21px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--g1);box-shadow:0 0 0 3px var(--bg)}
.tl-i.toca::before{animation:late 1.4s ease-in-out infinite}
.tl-i .fila{border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.tl-i .dia{background:color-mix(in srgb,var(--g1) 12%,var(--surface));color:var(--g1)}
.tl-i .dia span{color:var(--g1)}
.tl-i.toca .dia{background:linear-gradient(135deg,var(--g1),var(--g2));color:#FFFFFF}
.tl-i.toca .dia span{color:#FFFFFF}
.tl-i.paso{opacity:.6}

/* muro de lo que valoro */
.muro{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.nota{position:relative;min-height:128px;padding:14px 12px 10px;border-radius:6px 6px 18px 6px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  transform:rotate(var(--r,0deg));box-shadow:0 10px 18px -12px rgba(0,0,0,.35);background:color-mix(in srgb,var(--g1) 16%,var(--surface));transition:transform .2s ease}
.nota:active{transform:rotate(0) scale(.98)}
.nota p{font-size:.94rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.nota-b{display:flex;align-items:center;justify-content:space-between;gap:4px}
.nota-dicho{min-height:32px;padding:0 10px;border-radius:999px;font-size:.76rem;font-weight:800;background:var(--surface);color:var(--g1)}
.nota.dicha{opacity:.72}
.nota.dicha .nota-dicho{background:var(--g1);color:#FFFFFF}
.nota .mini{width:32px;height:32px}
.nota.dicha p{padding-right:52px}
.sello{position:absolute;top:8px;right:8px;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--g1);border:2px solid var(--g1);border-radius:6px;padding:1px 6px;transform:rotate(8deg)}

/* radar */
.radar-c{margin-bottom:14px}
.radar-h{font-size:1.08rem;font-weight:800;letter-spacing:-.02em}
.radar{display:block;width:100%;max-width:340px;margin:4px auto 0;overflow:visible}
.radar .rg{fill:none;stroke:var(--line)}
.radar .rx{stroke:var(--line)}
.radar .rp{fill:url(#rgrad);fill-opacity:.38;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;transform-origin:150px 135px}
main.anim .radar .rp{animation:abre .9s cubic-bezier(.2,.9,.3,1.2) both .15s}
@keyframes abre{from{transform:scale(0)}to{transform:scale(1)}}
.radar .rd{stroke:var(--surface);stroke-width:2}
.radar text{font-size:12px;font-weight:700;fill:var(--muted);font-family:var(--ui)}
.radar text.suyo{fill:var(--text);font-weight:800}
.radar-tip{font-size:.95rem;font-weight:600;line-height:1.4;text-align:center;margin:6px 4px 12px}
.radar-l{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.radar-l button{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;border-radius:999px;background:var(--fill);font-size:.8rem;font-weight:700}
.radar-l i{width:9px;height:9px;border-radius:50%}
.radar-l b{color:var(--muted);font-weight:700}

/* generador tipo tragamonedas */
.gen-r{border:0;color:#FFFFFF;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 16px 28px -18px var(--g1)}
.gen-r .rev-l{color:rgba(255,255,255,.85)}
.gen-r .gen-l{border-top-color:rgba(255,255,255,.22)}
.gen-r .gen-l span{color:rgba(255,255,255,.8)}
.gen-r .b-sec{background:rgba(255,255,255,.2);color:#FFFFFF}
.gen-r .b-pri{background:#FFFFFF;color:var(--g1);box-shadow:none}
.gen-plan.gira{filter:blur(.6px);opacity:.85}
.gen-plan.cae{animation:cae .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes cae{from{transform:translateY(-12px) scale(.96)}to{transform:none}}

/* guías y gestos con color */
.guia .ico{background:linear-gradient(135deg,var(--g1),var(--g2));color:#FFFFFF}
.chip-c{display:inline-flex;align-items:center;gap:6px}
.chip-c::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.rit .barra i{background:var(--c,var(--ok))}
.rit.venc .barra i{background:var(--rosa)}

/* celebraciones */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.px{position:absolute;width:9px;height:9px;border-radius:2px;background:var(--c);animation:vuela 1.05s cubic-bezier(.12,.7,.3,1) forwards}
.px.cora{width:auto;height:auto;background:none;color:var(--c);font-size:18px;line-height:1}
.px.cora::before{content:"\2665"}
@keyframes vuela{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}75%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1)}}
.lluvia{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;background:var(--c);animation:llueve var(--t,2.4s) cubic-bezier(.3,.6,.6,1) forwards}
@keyframes llueve{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}

/* ================= Nov 3: historias, mazo y consejero ================= */
@keyframes rota{to{transform:rotate(360deg)}}
@keyframes llena{to{width:100%}}
.hist-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:14px;padding:4px 2px}
.hist-ring{position:relative;width:64px;height:64px;flex:none;border-radius:50%}
.hist-ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#2F9BFF,#FFC23D,#7B5CFF,#2F9BFF,#2F9BFF);animation:rota 5s linear infinite}
.hist-ring img,.hist-ring span{position:absolute;inset:3px;border-radius:50%;border:2.5px solid var(--bg);object-fit:cover;width:calc(100% - 6px);height:calc(100% - 6px);background:var(--fill);display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:var(--muted)}
.hist-btn b{display:block;font-size:1.02rem;font-weight:800}
.hist-btn .meta{margin:0}
.hist-btn .play{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.hist-btn .play svg{width:16px;height:16px;fill:currentColor;stroke:none}
.hist-v{position:fixed;inset:0;z-index:60;color:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(420px 420px at 85% 15%,rgba(255,255,255,.18),transparent 60%),radial-gradient(380px 380px at 10% 90%,rgba(0,0,0,.18),transparent 60%),linear-gradient(160deg,var(--g1),var(--g2));animation:aparece .2s ease;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.hist-bar{display:flex;gap:4px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;position:relative;z-index:3}
.hist-bar i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.hist-bar b{display:block;height:100%;width:0;background:#FFFFFF}
.hist-bar i.lleno b{width:100%}
.hist-bar i.act b{animation:llena 6.5s linear forwards}
.hist-v.pausa .hist-bar i.act b{animation-play-state:paused}
.hist-x{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:8px;z-index:4;width:44px;height:44px;display:grid;place-items:center;color:#FFFFFF}
.hist-c{position:relative;z-index:2;flex:1;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:24px 28px 90px;pointer-events:none}
.hist-et{font-size:.86rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;opacity:.88}
.hist-t{font-size:clamp(1.75rem,7.6vw,2.5rem);font-weight:800;line-height:1.14;letter-spacing:-.025em;margin-top:10px;animation:entra .5s cubic-bezier(.2,.8,.2,1)}
.hist-s{font-size:1.05rem;font-weight:600;opacity:.9;margin-top:14px;animation:entra .5s cubic-bezier(.2,.8,.2,1) .08s both}
.hist-foto{width:116px;height:116px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px rgba(255,255,255,.55);margin-bottom:24px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.hist-fin{pointer-events:auto;align-self:flex-start;margin-top:28px;background:#FFFFFF;color:var(--g1)}
.hist-zona{position:absolute;top:0;bottom:0;z-index:1}
.hist-zona.izq{left:0;width:32%}
.hist-zona.der{right:0;width:68%}
.hist-pie{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.78rem;font-weight:700;opacity:.7;z-index:2;pointer-events:none}

.deck{position:relative;height:262px;margin:2px 0 12px}
.dk{position:absolute;inset:0 0 18px;border-radius:26px;padding:20px;color:#FFFFFF;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(260px 200px at 90% 0%,rgba(255,255,255,.2),transparent 60%),linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 18px 30px -18px var(--g1);
  transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s ease;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.dk[data-pos="1"]{transform:translateY(10px) scale(.95);opacity:.8}
.dk[data-pos="2"]{transform:translateY(20px) scale(.9);opacity:.5}
.dk[data-pos="0"]{z-index:3;cursor:grab}
.dk.arrastra{transition:none;cursor:grabbing}
.dk-e{display:inline-flex;align-self:flex-start;font-size:.78rem;font-weight:800;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px}
.dk-t{font-size:1.45rem;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.dk-m{font-size:.86rem;font-weight:600;opacity:.88}
.dk-si,.dk-no{position:absolute;top:64px;font-size:.9rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border:3px solid #FFFFFF;border-radius:10px;padding:3px 10px;opacity:0;pointer-events:none}
.dk-si{left:20px;transform:rotate(-12deg)}
.dk-no{right:20px;transform:rotate(12deg)}
.deck-b{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px}
.deck-b .redondo{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s ease}
.deck-b .redondo:active{transform:scale(.9)}
.deck-b .redondo svg{width:24px;height:24px}
.deck-b .no{color:var(--muted)}
.deck-b .si{color:var(--accent)}
.deck-b .si svg{fill:currentColor}
.deck-fin{text-align:center;padding:40px 10px;color:var(--muted);font-weight:600}

.coach{margin-bottom:14px;position:relative;overflow:hidden}
.coach::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,#2F9BFF,#7B5CFF,#2F9BFF);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.coach-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.coach-i{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#FFFFFF;background:linear-gradient(135deg,#2F9BFF,#7B5CFF);animation:late 2.2s ease-in-out infinite}
.coach-i svg{width:22px;height:22px}
.coach h2{font-size:1.08rem;font-weight:800;letter-spacing:-.02em}
.coach .chips{margin:0 -16px;padding:2px 16px 12px}
.coach textarea{min-height:84px}
.coach-r{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--fill);white-space:pre-wrap;font-size:.98rem;line-height:1.55}
.coach-r.pensando{color:var(--muted);font-weight:600}
.coach-r.pensando::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:puntos 1.2s steps(4) infinite}
@keyframes puntos{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ================= Nov 4: estilo suave ================= */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --text:#1B1530; --muted:#7A7590; --line:#EFEDF5; --line2:#E2DFEC; --fill:#F5F4F9;
  --accent:#6E3BD1; --accent-fg:#FFFFFF; --accent-soft:#EFE8FC; --accent-text:#5B2FB8;
  --rosa:#6E3BD1; --rosa-soft:#EFE8FC; --lila-suave:#E6DAFA;
  --grad:#8E63E8; --glow:rgba(110,59,209,.25);
  --k-palabras:#8E63E8; --k-tiempo:#5B7FE0; --k-detalles:#FF8A3D; --k-actos:#22A699; --k-contacto:#F5A524;
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121019; --surface:#1B1824; --text:#F3F1FA; --muted:#A39FB5; --line:#2A2636; --line2:#3A3548; --fill:#24212F;
    --accent:#A586F2; --accent-fg:#16101F; --accent-soft:#2C2440; --accent-text:#C2AEF7;
    --rosa:#A586F2; --rosa-soft:#2C2440; --lila-suave:#2C2440;
    --grad:#8E63E8; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1B1824; --text:#F3F1FA; --muted:#A39FB5; --line:#2A2636; --line2:#3A3548; --fill:#24212F;
  --accent:#A586F2; --accent-fg:#16101F; --accent-soft:#2C2440; --accent-text:#C2AEF7;
  --rosa:#A586F2; --rosa-soft:#2C2440; --lila-suave:#2C2440;
  --grad:#8E63E8; --shadow:none;
}
body{background:var(--bg)}
.g-lila{--g1:#8E63E8;--g2:#A584F0}
.g-cielo{--g1:#5B7FE0;--g2:#7A97EA}
.g-menta{--g1:#22A699;--g2:#3DBDAF}
.g-coral{--g1:#F26B4F;--g2:#F7876F}
.g-rosa{--g1:#FF8A3D;--g2:#FFA25F}
.g-amar{--g1:#F5A524;--g2:#F8B94B}

/* tipografía más ligera */
.titulo{font-weight:600;letter-spacing:-.025em;background:none;-webkit-text-fill-color:currentColor;color:var(--text)}
.marca{font-weight:700}
.marca::before{background:#8E63E8;border-radius:50%}
.sub{font-weight:600}
.fecha-hoy{font-weight:500}
.fecha-t,.juntas-t{font-weight:600}
.enlace{text-decoration:none;color:var(--accent-text);font-weight:600}

/* sin sombras ni fondos que se mueven */
.lista,.tarjeta,.sit,.captura,.stat,.icono,.tl-i .fila,.deck-b .redondo{box-shadow:none}
.lista,.tarjeta,.sit{border-color:var(--line);border-radius:20px}
.gesto,.reto,.gen-r,.dk,.fh.toca,.tl-i.toca .dia{animation:none;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:none}
.gesto::before,.gesto::after,.reto::before,.frente::after{display:none}
.flama.viva,.j-cora,.tl-i.toca::before{animation:none;filter:none}

/* botones y campos */
.b{border-radius:12px;font-weight:600}
.b-pri{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.b-sec{background:var(--fill)}
.chip{font-weight:500;border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg{background:var(--fill);border-radius:12px}
.seg button{font-weight:600}
.campo{background:var(--fill);border-color:transparent;border-radius:10px}
.campo:focus-visible{background:var(--surface)}

/* personajitos */
.blob{display:block;width:100%;height:100%;overflow:visible}

/* gesto de hoy */
.frente{background:var(--lila-suave);color:var(--text);box-shadow:none}
.frente-i{width:110px;height:110px;background:none;border-radius:0;animation:none;margin-bottom:2px}
.frente-i svg{width:100%;height:100%}
.frente b{font-weight:600;font-size:1.3rem}
.frente span:last-child{color:var(--muted);opacity:1;font-weight:500}
.gesto-x{font-weight:600}
.gesto .b-pri{color:var(--g1)}

/* racha */
.flama{width:50px;height:50px}
.flama.viva{color:#FF8A3D}
.racha-n b{font-weight:600}
.hm-c i{border-radius:4px}

/* reto y tiempo juntas */
.reto{border-radius:20px}
.reto-t{font-weight:600}
.j-num div{background:var(--fill)}
.j-num b{font-weight:600;color:var(--text)}
.j-barra i{background:#8E63E8}
.j-ico{background:var(--lila-suave);color:#8E63E8}
.j-cora{color:#8E63E8}

/* fechas */
.fh{background:var(--fill);border:0;border-radius:18px}
.fh b{font-weight:600}
.tl::before{background:var(--line2)}
.tl-i .dia{background:var(--fill);color:var(--text)}
.tl-i .dia span{color:var(--muted)}
.toca .cuando{background:var(--accent-soft);color:var(--accent-text)}

/* tarjetas */
.rit .barra{background:var(--fill)}
.muro{gap:10px}
.nota{border-radius:18px;box-shadow:none;background:color-mix(in srgb,var(--g1) 14%,var(--surface))}
.nota p{font-weight:500}
.dk{border-radius:22px}
.dk-t{font-weight:600}

/* guías */
.guia .ico{width:48px;height:48px;background:none;border-radius:0;padding:0}
.guia .ico svg{width:48px;height:48px}
.guia b{font-weight:600}

/* generador */
.gen-cara{width:64px;height:64px;margin:2px auto 12px}
.gen-plan{font-weight:600}

/* radar */
.radar .rp{fill:#8E63E8;fill-opacity:.22;stroke:#8E63E8}
.radar-h{font-weight:600}
.radar-tip{font-weight:500;color:var(--muted);font-size:.88rem}

/* vacíos */
.vacio{border:0;background:var(--fill);border-radius:20px}
.vacio .blob{width:56px;height:56px;margin:0 auto 10px}
.deck-fin .blob{width:64px;height:64px;margin:0 auto 10px}

/* bienvenida */
.bien{padding:7vh 2px 30px}
.bien-blobs{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px;margin:0 -6px 20px;padding:22px 10px 16px;border-radius:28px;background:linear-gradient(180deg,var(--bg),var(--lila-suave))}
.bien-blobs svg{width:58px;height:58px}
.bien-blobs svg:nth-child(2n){transform:translateY(-14px) rotate(-8deg)}
.bien-blobs svg:nth-child(3){width:72px;height:72px}
.marca-g{font-weight:700;margin-top:0}
.bien-x{font-weight:500;font-size:1.1rem}

/* barra inferior */
.tab{font-weight:600}
.tab[aria-current="page"] .tab-i{background:var(--accent-soft);animation:none}
/* gestos: tarjeta de hoy */
.g2{position:relative;display:flex;flex-direction:column;padding:20px;min-height:248px;overflow:hidden}
.g2-cara{position:absolute;right:-14px;top:-12px;width:118px;height:118px;opacity:.95;transform:rotate(-8deg)}
.g2-cara .blob g{fill-opacity:.24;stroke-opacity:0}
.g2-cara .blob circle[fill="#1B1530"],.g2-cara .blob path{opacity:.55}
.g2-top{position:relative;z-index:1}
.g2-tipo{display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.02em;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px}
.g2-x{position:relative;z-index:1;font-size:1.55rem;line-height:1.22;font-weight:600;letter-spacing:-.02em;margin:auto 0 0;padding-top:22px;padding-right:24px;text-wrap:balance}
.g2-meta{position:relative;z-index:1;display:flex;align-items:center;gap:6px;font-size:.86rem;font-weight:500;color:rgba(255,255,255,.88);margin-top:8px}
.g2-meta svg{width:14px;height:14px}
.g2-b{position:relative;z-index:1;margin-top:18px;flex-wrap:nowrap}
.g2-b .b{flex:1}
.g2-b .b-pri{background:#FFFFFF;color:var(--g1)}
.g2-b .b-sec{background:rgba(255,255,255,.2);color:#FFFFFF}
.g2.hecho .g2-x{opacity:.9}
.rit.listo{opacity:.55}
/* guías y manual en una sola lista */
.sit{border-radius:20px}
.sit-b{min-height:80px;padding:16px 12px 16px 16px;gap:14px;font-weight:600;font-size:1rem}
.sit-b .ico{width:48px;height:48px;flex:none}
.sit-b .ico svg{width:48px;height:48px}
.gen-ya{display:inline-flex;align-items:center;gap:6px;cursor:default;background:rgba(255,255,255,.2)!important;color:#FFFFFF!important}
.gen .rot{margin-top:14px}
/* preguntas */
.preg-azar{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:12px;background:color-mix(in srgb,#22A699 12%,var(--surface));border:0}
.preg-azar[disabled]{opacity:.5}
.preg-azar-b{width:46px;height:46px;flex:none}
.preg-azar b{display:block;font-weight:600}
.preg-azar .meta{margin:0}
.preg-q{text-align:left;min-width:0}
.preg-r-q{margin:0 0 2px}
.fila-f .preg-q{padding:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function clasificar(t){
  t = String(t || '').toLowerCase();
  if(/abraz|mano|cercan|masaje|bes[oa]|acurr|bail/.test(t)) return 'contacto';
  if(/hazte cargo|pendiente|ayud|resuélv|prepárale|quítale|ofréc|organiza|cocinarle|llevarla|ir por ella/.test(t)) return 'actos';
  if(/detalle|llévale|cómprale|flor|regal|antojo|sorprénd|sorpresa|consiént|nota escrita|foto|canción|playlist|orden/.test(t)) return 'detalles';
  if(/plan|celular|camin|juntas|escucha|pregúnt|retoma|apoya|acompáñ|hora completa|cita|platica|desayun|ver juntas/.test(t)) return 'tiempo';

}

function burst(fuerte){

    q.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
    q.style.setProperty('--dy', (Math.sin(ang) * dist - 30).toFixed(0) + 'px');
    q.style.setProperty('--c', cols[i % cols.length]);
    q.style.setProperty('--rot', Math.round(Math.random() * 540 - 270) + 'deg');

    for(var j=0;j<70;j++){

      c.style.left = (Math.random() * 100) + 'vw';

    }

}
function contar(raiz){

      var k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);

function radar(){
  var desde = iso(masDias(hoy(), -30)), cnt = {}, total = 0;
  EJES.forEach(function(e){ cnt[e] = 0; });
  state.log.forEach(function(x){ if(x.f >= desde && cnt[x.c] != null){ cnt[x.c]++; total++; } });
  var max = Math.max(3, Math.max.apply(null, EJES.map(function(e){ return cnt[e]; })));
  var cx = 150, cy = 135, R = 88;
  function pt(i, f){ var a = (-90 + i * 72) * Math.PI / 180; return [(cx + Math.cos(a) * R * f).toFixed(1), (cy + Math.sin(a) * R * f).toFixed(1)]; }
  var g = '';
  [1/3, 2/3, 1].forEach(function(f){ g += '<polygon class="rg" points="' + EJES.map(function(e, i){ return pt(i, f).join(','); }).join(' ') + '"/>'; });
  EJES.forEach(function(e, i){ var q = pt(i, 1); g += '<line class="rx" x1="' + cx + '" y1="' + cy + '" x2="' + q[0] + '" y2="' + q[1] + '"/>'; });
  var vals = EJES.map(function(e, i){ return pt(i, .08 + .92 * cnt[e] / max); });
  g += '<polygon class="rp" points="' + vals.map(function(v){ return v.join(','); }).join(' ') + '"/>';
  vals.forEach(function(v, i){ g += '<circle class="rd" cx="' + v[0] + '" cy="' + v[1] + '" r="5" fill="var(--k-' + EJES[i] + ')"/>'; });
  EJES.forEach(function(e, i){
    var q = pt(i, 1.22), x = +q[0], anc = x < cx - 10 ? 'end' : x > cx + 10 ? 'start' : 'middle';
    var suyo = state.amor.indexOf(e) >= 0;
    g += '<text x="' + q[0] + '" y="' + (+q[1] + 4) + '" text-anchor="' + anc + '"' + (suyo ? ' class="suyo"' : '') + '>' + (suyo ? '★ ' : '') + EJE_N[e] + '</text>';
  });
  var tip;
  if(!total) tip = 'Sin gestos este mes';
  else {
    var orden = EJES.slice().sort(function(a, b){ return cnt[b] - cnt[a]; }), top = orden[0];
    var suyos = state.amor.filter(function(e){ return EJES.indexOf(e) >= 0; });
    if(suyos.length){
      var bajo = suyos.slice().sort(function(a, b){ return cnt[a] - cnt[b]; })[0], nom = (amorDe(bajo) || {n:EJE_N[bajo]}).n.toLowerCase();
      tip = 'Más: ' + EJE_N[top].toLowerCase() + ' · Se siente querida con: ' + nom;
    } else tip = 'Más: ' + EJE_N[top].toLowerCase() + ' · Menos: ' + EJE_N[orden[orden.length - 1]].toLowerCase();
  }
  return '<section class="tarjeta radar-c"><h2 class="radar-h">Así la estoy queriendo</h2><p class="meta">Últimos 30 días</p>' +
    '<svg class="radar" viewBox="0 0 300 270" role="img" aria-label="' + EJES.map(function(e){ return EJE_N[e] + ' ' + cnt[e]; }).join(', ') + '">' +
    '<defs><linearGradient id="rgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F9BFF"/><stop offset="1" stop-color="#7B5CFF"/></linearGradient></defs>' + g + '</svg>' +
    '<p class="radar-tip">' + tip + '</p>' +
    '<div class="radar-l">' + EJES.map(function(e){
      return '<button data-a="radar-ir" data-v="' + e + '"><i style="background:var(--k-' + e + ')"></i>' + EJE_N[e] + ' <b>' + cnt[e] + '</b></button>';
    }).join('') + '</div></section>';
}

function quitarEjemplos(){
  var ids = {};
  state.regalos.forEach(function(r){ if(r.ej) ids[r.id] = 1; });
  ['notas','regalos','fechas','semana','focos','revisiones','aprend','valoro','pedidos','temas','log','respuestas'].forEach(function(k){ state[k] = state[k].filter(function(x){ return !x.ej; }); });
  Object.keys(state.retos).forEach(function(k){ if(state.retos[k].ej) delete state.retos[k]; });
  state.notas.forEach(function(n){ if(n.regaloId && ids[n.regaloId]) delete n.regaloId; });
  state.manual.forEach(function(m){ BLOQUES.forEach(function(b){ m[b.id] = m[b.id].filter(function(x){ return !x.ej; }); }); });
  state.rituales.forEach(function(r){ if(r.ejU){ r.ultimo = ''; delete r.ejU; } });
  if(state.inicioEj){ state.inicio = ''; state.inicioEj = false; }
  if(state.amorEj){ state.amor = []; state.amorEj = false; }
  if(state.chequeoEj){ state.chequeo.ultimo = ''; state.chequeoEj = false; }
}

/* ---------- acciones ---------- */
function val(sel){ var e = $(sel); return e ? e.value.trim() : ''; }
function falta(sel, msg, foco){ $(sel).textContent = msg; if(foco && $(foco)) $(foco).focus(); }

function accion(a, el){
  var id = el && el.getAttribute('data-id'), v = el && el.getAttribute('data-v'), k = iso(hoy());
  switch(a){
    case 'tab': ui.tab = v; ui.anim = true; window.scrollTo(0, 0); render(); break;
    case 'sub': ui.sub = v; ui.anim = true; render(); break;
    case 'filtro': ui.filtro = v; render(); break;
    case 'preg-cat': ui.pregCat = v; render(); break;
    case 'pq-modo': ui.pqModo = v; ui.pq = null; render(); break;
    case 'pq-tipo': ui.pqTipo = v; render(); break;
    case 'pq':
      ui.pq = generarPregunta(); if(!ui.pq) toast('No hay preguntas aquí');
      render(); girarEn('.gen-r .gen-plan', function(){ var t = generarPregunta(); ui.pqVistos.pop(); return t; });
      var pqr = $('.gen-r'); if(pqr && pqr.scrollIntoView) pqr.scrollIntoView({block:'nearest', behavior: sinMov() ? 'auto' : 'smooth'});
      break;
    case 'gg-modo': ui.ggModo = v; ui.gg = null; render(); break;
    case 'gg-tipo': ui.ggTipo = v; render(); break;
    case 'gg':
      ui.gg = generarGesto(); render();
      girarEn('.gen-r .gen-plan', function(){ return elegir(gestosPool('todas')).t; });
      var ggr = $('.gen-r'); if(ggr && ggr.scrollIntoView) ggr.scrollIntoView({block:'nearest', behavior: sinMov() ? 'auto' : 'smooth'});
      break;
    case 'gg-hoy':
      if(!ui.gg) break;
      registrarGesto(ui.gg.t, ui.gg.eje, ui.gg.cada); anotar(ui.gg.eje, 'gen'); ui.gg = null;
      guardar(); render(); burst(false); toast('Anotado'); break;
    case 'gg-add':
      if(!ui.gg) break;
      if(!state.rituales.some(function(r){ return r.nombre.toLowerCase() === ui.gg.t.toLowerCase(); }))
        state.rituales.push({id:uid(), nombre:ui.gg.t, cada:ui.gg.cada, ultimo:'', cat:ui.gg.eje});
      guardar(); render(); toast('Agregado a mis gestos'); break;
    case 'preg-abrir': hojaPregunta(v); break;
    case 'preg-azar':
      var pz = pregLista(ui.pregCat).filter(function(x){ return !respuestaDe(x.q); });
      if(pz.length) hojaPregunta(pz[Math.floor(Math.random() * pz.length)].q);
      break;
    case 'guardar-resp':
      var pra = val('#pr-a');
      if(!pra){ falta('#pr-e', 'Escribe su respuesta.', '#pr-a'); break; }
      var prx = respuestaDe(v);
      if(prx){ prx.a = pra; delete prx.ej; }
      else {
        var pcat = catDe(v);
        state.respuestas.unshift({id:uid(), q:v, a:pra, cat:pcat, fecha:k});
        anotar('tiempo', 'pregunta');
      }
      guardar(); cerrarHoja(); render(); toast('Guardado'); break;
    case 'del-resp': state.respuestas = quitar(state.respuestas, id); guardar(); render(); toast('Borrado'); break;
    case 'add-preg':
      var pqi = document.querySelector('[data-foco="preg"]'), pqt = pqi ? pqi.value.trim() : '';
      if(!pqt){ if(pqi) pqi.focus(); break; }
      if(!/^¿/.test(pqt)) pqt = '¿' + pqt.replace(/\?+$/, '') + '?';
      pqt = '¿' + pqt.charAt(1).toUpperCase() + pqt.slice(2);
      state.pregMias.push({id:uid(), q:pqt}); ui.foco = 'preg'; guardar(); render(); break;
    case 'del-preg': state.pregMias = quitar(state.pregMias, id); guardar(); render(); break;
    case 'datos-copiar': hojaDatos(); break;
    case 'datos-pegar': hojaPegar(); break;
    case 'datos-cargar':
      var crudo = null;
      try{ crudo = JSON.parse(val('#imp')); }catch(e){}
      if(!crudo || typeof crudo !== 'object' || !Array.isArray(crudo.notas)){ falta('#i-e', 'Eso no parece una copia de Nov.', '#imp'); break; }
      state = normalize(crudo); state.bienvenida = true;
      guardar(); cerrarHoja(); render(); toast('Datos cargados'); break;
    case 'crecer-sub': ui.crecer = v; ui.anim = true; render(); break;
    case 'historia': ui.hist = {i:0, slides:historias(), de:'[data-a="historia"]'}; renderHist(); break;
    case 'hist-sig': if(ui.histHold){ ui.histHold = false; break; } histMover(1); break;
    case 'hist-ant': if(ui.histHold){ ui.histHold = false; break; } histMover(-1); break;
    case 'hist-cerrar': cerrarHist(); break;
    case 'deck-si': mazoAccion('si'); break;
    case 'deck-no': mazoAccion('no'); break;
    case 'deck-hoy': mazoAccion('hoy'); break;
    case 'coach-rapido': var cq = $('#coach-q'); if(cq){ cq.value = v; ui.coachQ = v; cq.focus(); } break;
    case 'coach-ir': pedirConsejo(); break;
    case 'coach-stop': if(coachCtl) coachCtl.abort(); break;
    case 'revelar':
      state.revelado = k; guardar();
      var fl = $('.flip'); if(fl){ fl.classList.add('volteada'); var fr = fl.querySelector('.frente'), at = fl.querySelector('.atras'); if(fr) fr.setAttribute('inert', ''); if(at){ at.removeAttribute('inert'); } }
      setTimeout(function(){ var b0 = $('.atras [data-a="hecho"]'); if(b0 && document.activeElement === el) b0.focus(); }, 450);
      break;
    case 'reto-mas':
      var rx = retoSemana(), nn = Math.min(rx.r.n, rx.n + 1), okr = nn >= rx.r.n;
      state.retos[rx.key] = {i:rx.i, n:nn, ok:okr};
      anotar(rx.r.c, 'reto'); guardar(); render(); burst(okr);
      if(okr) toast('Reto cumplido');
      break;
    case 'reto-otro':
      var ro = retoSemana(); state.retos[ro.key] = {i:(ro.i + 1) % RETOS.length, n:0, ok:false}; guardar(); render();
      var rt0 = $('.reto'); if(rt0 && !sinMov()){ rt0.style.animation = 'none'; void rt0.offsetWidth; rt0.style.animation = 'entra .45s cubic-bezier(.2,.8,.2,1)'; }
      break;
    case 'radar-ir': ui.tab = 'crecer'; ui.crecer = 'habitos'; ui.gTipo = v || 'todas'; ui.anim = true; render();
      var mg = $('.chips'); if(mg && mg.scrollIntoView) mg.scrollIntoView({block:'center', behavior: sinMov() ? 'auto' : 'smooth'});
      break;
    case 'tema': hojaTema(); break;
    case 'avatar': if(state.fotoMaria) hojaAvatar(); else pedirFotos('avatar'); break;
    case 'avatar-cambiar': cerrarHoja(); pedirFotos('avatar'); break;
    case 'avatar-quitar':
      var vieja = state.fotoMaria; state.fotoMaria = null; soltarAsset(vieja && vieja.a);
      guardar(); cerrarHoja(); render(); toast('Foto quitada'); break;
    case 'foto-add': pedirFotos('galeria'); break;
    case 'ver-foto': ui.borrar = false; hojaFoto(id); break;
    case 'rec-otro': ui.recOff++; render(); break;
    case 'foto-guardar':
      var fg = buscar(state.fotos, id); if(fg){ fg.nota = val('#fo-n'); }
      guardar(); cerrarHoja(); render(); break;

var local = leerLocal();
if(local){ state = normalize(local); habiaLocal = true; ui.modo = 'dispositivo'; ui.listo = true; }
else { ui.modo = guardarLocal() ? 'dispositivo' : 'memoria'; try{ localStorage.removeItem(LS_KEY); }catch(e){} }
render();
if(RN && habiaLocal) guardarLocal();
var espera = new Promise(function(res){ setTimeout(res, 2500); });
var conexion = conectar();
if(window.claude && typeof window.claude.use === 'function'){
  window.claude.use('assets').then(function(a){ assetsNS = a; }).catch(function(){});
  window.claude.use('sample').then(function(f){ sampleNS = f; if(f && ui.tab === 'guias' && !ui.hoja && ui.listo) render(); }).catch(function(){});
}
Promise.race([conexion, espera]).then(function(){ ui.listo = true; ui.anim = true; render(); });
conexion.then(function(){ if(ui.listo && !ui.hoja) render(); });

})();
</script>
</body>
</html>
